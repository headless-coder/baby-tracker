<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Tracker (Nara Alternative)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse for robust CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-amber-50/50 text-slate-800 font-sans antialiased min-h-screen flex flex-col" x-data="babyApp()">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-amber-100 shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-100 text-indigo-600 p-2 rounded-xl">
                    <i class="fa-solid fa-baby text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-pink-500 bg-clip-text text-transparent">BabyLogs</h1>
                    <div class="text-[11px] font-mono text-slate-500" x-text="'Clock (' + currentTimezone + '): ' + liveClock"></div>
                </div>
            </div>
            <template x-if="user">
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-slate-500 hidden sm:inline" x-text="user.email"></span>
                    <button @click="logout()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-medium transition">Logout</button>
                </div>
            </template>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full relative">

        <!-- AUTH SCREEN -->
        <template x-if="!user">
            <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-amber-100 mt-10">
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold text-slate-800">Welcome Back</h2>
                    <p class="text-sm text-slate-500">Sign in or create your free account to track your baby's logs</p>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Email</label>
                        <input type="email" x-model="authEmail" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Password</label>
                        <input type="password" x-model="authPassword" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div class="flex space-x-3 pt-2">
                        <button @click="login()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-xl transition">Sign In</button>
                        <button @click="signup()" class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-medium py-2 rounded-xl transition">Register</button>
                    </div>
                    <p class="text-xs text-red-500 text-center mt-2" x-text="authError"></p>
                </div>
            </div>
        </template>

        <!-- APP DASHBOARD -->
        <template x-if="user">
            <div>
                <!-- STREAMLINED COLOR-CODED SEGMENTED CONTROL BAR WITH HIGH Z-INDEX DROPDOWNS -->
                <div class="mb-6 flex justify-start sm:justify-center overflow-visible pb-2 relative z-50">
                    <nav class="inline-flex bg-slate-200/90 p-1.5 rounded-2xl gap-1.5 shadow-inner relative">
                        
                        <!-- ALL LOGS GROUP -->
                        <div class="relative" @click.outside="if (openNavMenu === 'all_group') openNavMenu = null">
                            <button @click="openNavMenu = openNavMenu === 'all_group' ? null : 'all_group'"
                                :class="['all', 'search'].includes(activeTab) ? 'bg-white text-slate-800 shadow-sm' : 'bg-slate-100 hover:bg-slate-50 text-slate-700'"
                                class="px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 border-b-2 border-slate-400">
                                <i class="fa-solid fa-list text-slate-500"></i>
                                <span>All Logs</span>
                                <i class="fa-solid fa-chevron-down text-[10px] ml-0.5"></i>
                            </button>
                            <div x-show="openNavMenu === 'all_group'" x-cloak class="absolute left-0 top-full mt-2 w-56 bg-white rounded-2xl shadow-2xl border border-slate-200 py-2 z-50">
                                <button @click="switchTab('all'); openNavMenu = null" class="w-full text-left px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 flex items-center transition">
                                    <i class="fa-solid fa-list mr-2.5 text-slate-500 w-4"></i> All Logs
                                </button>
                                <button @click="switchTab('search'); openNavMenu = null" class="w-full text-left px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 flex items-center transition">
                                    <i class="fa-solid fa-magnifying-glass mr-2.5 text-slate-500 w-4"></i> Log Search & History
                                </button>
                            </div>
                        </div>

                        <!-- SLEEP GROUP (Indigo) -->
                        <div class="relative" @click.outside="if (openNavMenu === 'sleep_group') openNavMenu = null">
                            <button @click="openNavMenu = openNavMenu === 'sleep_group' ? null : 'sleep_group'"
                                :class="['sleep', 'sleep_stats', 'historical_sleep'].includes(activeTab) ? 'bg-indigo-600 text-white shadow-sm' : 'bg-indigo-50 hover:bg-indigo-100 text-indigo-700'"
                                class="px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 border-b-2 border-indigo-500">
                                <i class="fa-solid fa-bed" :class="['sleep', 'sleep_stats', 'historical_sleep'].includes(activeTab) ? 'text-white' : 'text-indigo-500'"></i>
                                <span>Sleep</span>
                                <i class="fa-solid fa-chevron-down text-[10px] ml-0.5"></i>
                            </button>
                            <div x-show="openNavMenu === 'sleep_group'" x-cloak class="absolute left-0 top-full mt-2 w-60 bg-white rounded-2xl shadow-2xl border border-indigo-100 py-2 z-50">
                                <button @click="switchTab('sleep'); openNavMenu = null" class="w-full text-left px-4 py-2.5 text-xs font-semibold text-indigo-950 hover:bg-indigo-50 flex items-center transition">
                                    <i class="fa-solid fa-bed mr-2.5 text-indigo-500 w-4"></i> Sleep Logs
                                </button>
                                <button @click="switchTab('sleep_stats'); openNavMenu = null" class="w-full text-left px-4 py-2.5 text-xs font-semibold text-indigo-950 hover:bg-indigo-50 flex items-center transition">
                                    <i class="fa-solid fa-chart-bar mr-2.5 text-indigo-500 w-4"></i> Sleep Analytics
                                </button>
                                <button @click="switchTab('historical_sleep'); openNavMenu = null" class="w-full text-left px-4 py-2.5 text-xs font-semibold text-indigo-950 hover:bg-indigo-50 flex items-center transition">
                                    <i class="fa-solid fa-clock-rotate-left mr-2.5 text-indigo-500 w-4"></i> Historical Sleep Data
                                </button>
                            </div>
                        </div>

                        <!-- MEDICINE GROUP (Emerald) -->
                        <div class="relative" @click.outside="if (openNavMenu === 'med_group') openNavMenu = null">
                            <button @click="openNavMenu = openNavMenu === 'med_group' ? null : 'med_group'"
                                :class="['medicine', 'med_stats'].includes(activeTab) ? 'bg-emerald-600 text-white shadow-sm' : 'bg-emerald-50 hover:bg-emerald-100 text-emerald-700'"
                                class="px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 border-b-2 border-emerald-500">
                                <i class="fa-solid fa-pills" :class="['medicine', 'med_stats'].includes(activeTab) ? 'text-white' : 'text-emerald-500'"></i>
                                <span>Medicine</span>
                                <i class="fa-solid fa-chevron-down text-[10px] ml-0.5"></i>
                            </button>
                            <div x-show="openNavMenu === 'med_group'" x-cloak class="absolute left-0 top-full mt-2 w-56 bg-white rounded-2xl shadow-2xl border border-emerald-100 py-2 z-50">
                                <button @click="switchTab('medicine'); openNavMenu = null" class="w-full text-left px-4 py-2.5 text-xs font-semibold text-emerald-950 hover:bg-emerald-50 flex items-center transition">
                                    <i class="fa-solid fa-pills mr-2.5 text-emerald-500 w-4"></i> Medicine Logs
                                </button>
                                <button @click="switchTab('med_stats'); openNavMenu = null" class="w-full text-left px-4 py-2.5 text-xs font-semibold text-emerald-950 hover:bg-emerald-50 flex items-center transition">
                                    <i class="fa-solid fa-chart-pie mr-2.5 text-emerald-500 w-4"></i> Medicine Analytics
                                </button>
                            </div>
                        </div>

                        <!-- MEMO GROUP (Amber) -->
                        <button @click="switchTab('memo')"
                            :class="activeTab === 'memo' ? 'bg-amber-600 text-white shadow-sm' : 'bg-amber-50 hover:bg-amber-100 text-amber-700'"
                            class="px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 border-b-2 border-amber-500">
                            <i class="fa-solid fa-note-sticky" :class="activeTab === 'memo' ? 'text-white' : 'text-amber-500'"></i>
                            <span>Memo</span>
                        </button>

                        <!-- SETTINGS GROUP (Slate) -->
                        <div class="relative" @click.outside="if (openNavMenu === 'settings_group') openNavMenu = null">
                            <button @click="openNavMenu = openNavMenu === 'settings_group' ? null : 'settings_group'"
                                :class="['settings', 'import'].includes(activeTab) ? 'bg-slate-700 text-white shadow-sm' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'"
                                class="px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 border-b-2 border-slate-400">
                                <i class="fa-solid fa-gear" :class="['settings', 'import'].includes(activeTab) ? 'text-white' : 'text-slate-500'"></i>
                                <span>Settings</span>
                                <i class="fa-solid fa-chevron-down text-[10px] ml-0.5"></i>
                            </button>
                            <div x-show="openNavMenu === 'settings_group'" x-cloak class="absolute left-0 top-full mt-2 w-56 bg-white rounded-2xl shadow-2xl border border-slate-100 py-2 z-50">
                                <button @click="switchTab('settings'); openNavMenu = null" class="w-full text-left px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 flex items-center transition">
                                    <i class="fa-solid fa-gear mr-2.5 text-slate-500 w-4"></i> Settings
                                </button>
                                <button @click="switchTab('import'); openNavMenu = null" class="w-full text-left px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 flex items-center transition">
                                    <i class="fa-solid fa-file-csv mr-2.5 text-slate-500 w-4"></i> CSV Import/Export
                                </button>
                            </div>
                        </div>

                    </nav>
                </div>

                <!-- QUICK LOG CARDS SECTION -->
                <div x-show="['all', 'sleep', 'medicine', 'memo'].includes(activeTab)" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        
                        <!-- Manual Sleep Logging Card -->
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-indigo-100 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between mb-3">
                                    <span class="font-semibold text-indigo-900 flex items-center"><i class="fa-solid fa-bed text-indigo-500 mr-2"></i> Manual Sleep Log</span>
                                </div>

                                <div class="space-y-3 my-2">
                                    <div>
                                        <div class="flex justify-between items-center mb-1">
                                            <label class="text-[10px] uppercase font-semibold text-slate-400">Start Date & Time (<span x-text="currentTimezone"></span>)</label>
                                            <div class="flex items-center space-x-1">
                                                <input type="checkbox" id="useCurrentStart" @change="toggleCurrentTime($event, 'start')" class="rounded text-indigo-600 focus:ring-indigo-500">
                                                <label for="useCurrentStart" class="text-[11px] text-indigo-600 font-medium cursor-pointer">Use Current Time</label>
                                            </div>
                                        </div>
                                        <input type="datetime-local" x-model="manualSleepStart" class="w-full text-xs px-2 py-1.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <input type="checkbox" id="isRunningEnd" x-model="manualSleepIsRunning" class="rounded text-indigo-600 focus:ring-indigo-500">
                                        <label for="isRunningEnd" class="text-xs text-indigo-700 font-medium cursor-pointer">Currently Running (End Later)</label>
                                    </div>
                                    <div x-show="!manualSleepIsRunning">
                                        <div class="flex justify-between items-center mb-1">
                                            <label class="text-[10px] uppercase font-semibold text-slate-400">End Date & Time (<span x-text="currentTimezone"></span>)</label>
                                            <div class="flex items-center space-x-1">
                                                <input type="checkbox" id="useCurrentEnd" @change="toggleCurrentTime($event, 'end')" class="rounded text-indigo-600 focus:ring-indigo-500">
                                                <label for="useCurrentEnd" class="text-[11px] text-indigo-600 font-medium cursor-pointer">Use Current Time</label>
                                            </div>
                                        </div>
                                        <input type="datetime-local" x-model="manualSleepEnd" class="w-full text-xs px-2 py-1.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                    </div>
                                </div>

                                <input type="text" x-model="sleepNote" placeholder="Sleep notes / tag..." class="w-full text-xs px-2.5 py-1.5 border rounded-lg my-2 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            </div>

                            <div class="pt-2">
                                <button @click="saveManualSleep()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2 rounded-xl transition" x-text="manualSleepIsRunning ? 'Start Running Sleep' : 'Save Sleep Entry'"></button>
                            </div>
                        </div>

                        <!-- Quick Medicine Card -->
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100 flex flex-col justify-between">
                            <div>
                                <span class="font-semibold text-emerald-900 flex items-center mb-3"><i class="fa-solid fa-pills text-emerald-500 mr-2"></i> Quick Medicine</span>
                                <input type="text" x-model="medTitle" placeholder="Medicine Name (e.g. Tylenol)" class="w-full text-xs px-2.5 py-1.5 border rounded-lg mb-2 focus:outline-none focus:ring-1 focus:ring-emerald-500">
                                <div class="flex space-x-2 mb-3">
                                    <input type="number" step="0.1" x-model="medAmount" placeholder="Amount" class="w-1/2 text-xs px-2.5 py-1.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-emerald-500">
                                    <input type="text" x-model="medUnit" placeholder="Unit (ml/mg)" class="w-1/2 text-xs px-2.5 py-1.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-emerald-500">
                                </div>
                            </div>
                            <button @click="saveMedicine()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 rounded-xl transition">Log Medicine</button>
                        </div>

                        <!-- Quick Memo Card -->
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-amber-100 flex flex-col justify-between">
                            <div>
                                <span class="font-semibold text-amber-900 flex items-center mb-3"><i class="fa-solid fa-note-sticky text-amber-500 mr-2"></i> Quick Memo</span>
                                <textarea x-model="memoText" placeholder="Add milestone, mood or notes..." rows="3" class="w-full text-xs px-2.5 py-1.5 border rounded-lg mb-3 resize-none focus:outline-none focus:ring-1 focus:ring-amber-500"></textarea>
                            </div>
                            <button @click="saveMemo()" class="w-full bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold py-2 rounded-xl transition">Save Memo</button>
                        </div>
                    </div>

                    <!-- Logs Feed List -->
                    <div class="bg-white rounded-2xl shadow-sm border border-amber-100 p-5">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-bold text-slate-800 flex items-center space-x-2">
                                <span x-text="activeTab === 'all' ? 'Recent Logs (Last 30)' : (activeTab === 'sleep' ? 'Recent Sleep Logs (Last 30)' : (activeTab === 'medicine' ? 'Recent Medicine Logs (Last 30)' : 'Recent Memo Logs (Last 30)'))"></span>
                            </h3>

                            <template x-if="['sleep', 'medicine', 'memo'].includes(activeTab) && filteredLogs.length > 0">
                                <button @click="deleteAllCategoryLogs(activeTab)" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-3 py-1.5 rounded-xl font-medium transition flex items-center">
                                    <i class="fa-solid fa-trash-can mr-1.5"></i> Delete All <span class="capitalize ml-1" x-text="activeTab"></span> Logs
                                </button>
                            </template>
                        </div>

                        <template x-if="filteredLogs.length === 0">
                            <p class="text-sm text-slate-400 text-center py-8">No recent logs found for this view.</p>
                        </template>

                        <div class="space-y-3">
                            <template x-for="log in filteredLogs" :key="log.id">
                                <div class="flex items-center justify-between p-3 rounded-xl border border-slate-100 hover:bg-slate-50 transition" :class="!log.end_time && log.category === 'sleep' ? 'bg-indigo-50/50 border-indigo-200' : ''">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white"
                                            :class="{
                                                'bg-indigo-500': log.category === 'sleep',
                                                'bg-emerald-500': log.category === 'medicine',
                                                'bg-amber-500': log.category === 'memo'
                                            }">
                                            <i class="fa-solid" :class="{
                                                'fa-bed': log.category === 'sleep',
                                                'fa-pills': log.category === 'medicine',
                                                'fa-note-sticky': log.category === 'memo'
                                            }"></i>
                                        </div>
                                        <div>
                                            <div class="text-sm font-semibold text-slate-800 capitalize flex items-center gap-2">
                                                <span x-text="log.category"></span>
                                                <template x-if="!log.end_time && log.category === 'sleep'">
                                                    <span class="text-[10px] bg-rose-500 text-white font-bold px-2 py-0.5 rounded-full animate-pulse">Running Now</span>
                                                </template>
                                            </div>
                                            <template x-if="log.category === 'sleep'">
                                                <div class="text-xs text-indigo-600 font-medium">
                                                    <span x-text="formatTimeInTZ(log.start_time)"></span> – 
                                                    <span x-text="log.end_time ? formatTimeInTZ(log.end_time) : 'Active'"></span> 
                                                    <template x-if="log.end_time">
                                                        <span>(<span x-text="formatDurationHoursMins(log.duration_minutes)"></span>)</span>
                                                    </template>
                                                </div>
                                            </template>
                                            <template x-if="log.category !== 'sleep'">
                                                <div class="text-xs text-slate-500" x-text="formatLogDetails(log)"></div>
                                            </template>
                                            <template x-if="log.notes && log.category !== 'memo'">
                                                <div class="text-xs text-slate-600 italic mt-0.5" x-text="'- ' + log.notes"></div>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <template x-if="!log.end_time && log.category === 'sleep'">
                                            <button @click="stopRunningLog(log)" class="bg-rose-500 hover:bg-rose-600 text-white text-xs px-2.5 py-1 rounded-lg font-semibold transition mr-2">Stop Sleep</button>
                                        </template>
                                        
                                        <span class="text-xs text-slate-400 mr-1" x-text="formatDateInTZ(log.start_time || log.created_at)"></span>
                                        
                                        <button @click="openEditModal(log)" class="text-slate-400 hover:text-indigo-600 p-1 transition" title="Edit Log"><i class="fa-solid fa-pen-to-square"></i></button>
                                        <button @click="deleteLog(log.id)" class="text-slate-300 hover:text-rose-500 p-1 transition" title="Delete Log"><i class="fa-solid fa-trash-can"></i></button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- TAB: ADVANCED LOG SEARCH -->
                <template x-if="renderedTabs['search']">
                    <div x-show="activeTab === 'search'" class="space-y-6">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-indigo-100 space-y-4">
                            <h3 class="font-bold text-slate-800 text-base">Search Historical Logs</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                                <div>
                                    <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Filter by Log Category</label>
                                    <select x-model="searchCategory" class="w-full text-xs px-3 py-2 border rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                        <option value="all">All Categories</option>
                                        <option value="sleep">Sleep Logs Only</option>
                                        <option value="medicine">Medicine Logs Only</option>
                                        <option value="memo">Memo Logs Only</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Filter Date</label>
                                    <input type="date" x-model="searchDate" class="w-full text-xs px-3 py-2 border rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                </div>
                                <div>
                                    <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Search Keywords</label>
                                    <input type="text" x-model="searchQuery" placeholder="Search title or notes..." class="w-full text-xs px-3 py-2 border rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                </div>
                                <div class="flex items-end">
                                    <button @click="searchDate = ''; searchQuery = ''; searchCategory = 'all'" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-2 rounded-xl transition">Reset Filters</button>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl shadow-sm border border-amber-100 p-5">
                            <div class="flex justify-between items-center mb-3">
                                <span class="font-bold text-slate-800 text-sm">Matching Historical Logs</span>
                                <span class="text-xs text-slate-400" x-text="'(' + searchedHistoricalLogs.length + ' results found)'"></span>
                            </div>
                            <div class="space-y-3">
                                <template x-for="log in searchedHistoricalLogs" :key="log.id">
                                    <div class="flex items-center justify-between p-3 rounded-xl border border-slate-100 hover:bg-slate-50 transition">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white"
                                                :class="{
                                                    'bg-indigo-500': log.category === 'sleep',
                                                    'bg-emerald-500': log.category === 'medicine',

                            setTimeout(() => this.renderSleepChart(), 40);
                        });
                    } else if (tabName === 'historical_sleep') {
                        this.fetchHistoricalSleepLogs().then(() => {
                            this.$nextTick(() => {
                                setTimeout(() => this.renderHistoricalChart(), 50);
                            });
                        });
                    } else if (tabName === 'med_stats') {
                        this.$nextTick(() => {
                            setTimeout(() => this.renderMedChart(), 40);
                        });
                    }
                },

                refreshTodaySleep() {
                    try {
                        const allCleanLogs = this.deduplicateSleepLogs([...this.logs, ...this.allSleepLogsCache]);
                        const splitSegments = this.splitSleepLogsAcrossMidnight(allCleanLogs);
                        
                        let tzNow = new Date(new Date().toLocaleString('en-US', { timeZone: this.currentTimezone }));
                        const pad = (n) => String(n).padStart(2, '0');
                        let todayStr = `${tzNow.getFullYear()}-${pad(tzNow.getMonth()+1)}-${pad(tzNow.getDate())}`;

                        let todayMins = splitSegments.filter(s => s.dateStr === todayStr).reduce((sum, s) => sum + s.durationMinutes, 0);
                        this.todayTotalSleepDuration = this.formatDurationHoursMins(todayMins);
                        this.todaySleepLastRefreshed = new Date().toLocaleTimeString([], { timeZone: this.currentTimezone, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    } catch (e) {
                        this.todayTotalSleepDuration = '0 hrs 0 mins';
                        this.todaySleepLastRefreshed = new Date().toLocaleTimeString();
                    }
                },

                loadPreviousWeek() {
                    if (this.sleepChartDaysWindow < 14) {
                        this.sleepChartDaysWindow += 7;
                        if (this.sleepChartDaysWindow > 14) this.sleepChartDaysWindow = 14;
                    }
                },

                resetToCurrentWeek() {
                    this.sleepChartDaysWindow = 7;
                },

                loadMoreHistoricalDays(days) {
                    this.historicalChartDaysWindow += days;
                },

                loadAllHistoricalData() {
                    const allLogs = this.deduplicateSleepLogs([...this.logs, ...this.allSleepLogsCache]);
                    const sleepLogs = allLogs.filter(l => l.category === 'sleep' && l.start_time);
                    if (sleepLogs.length > 0) {
                        const oldestDate = new Date(Math.min(...sleepLogs.map(l => new Date(l.start_time))));
                        const now = new Date();
                        const diffTime = Math.abs(now - oldestDate);
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        this.historicalChartDaysWindow = Math.max(30, diffDays + 5);
                    } else {
                        this.historicalChartDaysWindow = 365;
                    }
                },

                resetHistoricalChartWindow() {
                    this.historicalChartDaysWindow = 30;
                },

                saveTimezonePreference() {
                    localStorage.setItem('baby_tz', this.currentTimezone);
                    this.refreshTodaySleep();
                    if (this.renderedTabs['sleep_stats']) this.renderSleepChart();
                    if (this.renderedTabs['historical_sleep']) this.renderHistoricalChart();
                },

                toggleCurrentTime(event, field) {
                    if (event.target.checked) {
                        try {
                            const now = new Date();
                            const tzDate = new Date(now.toLocaleString('en-US', { timeZone: this.currentTimezone }));
                            const pad = (n) => String(n).padStart(2, '0');
                            const formatted = `${tzDate.getFullYear()}-${pad(tzDate.getMonth()+1)}-${pad(tzDate.getDate())}T${pad(tzDate.getHours())}:${pad(tzDate.getMinutes())}`;
                            if (field === 'start') this.manualSleepStart = formatted;
                            if (field === 'end') this.manualSleepEnd = formatted;
                        } catch (e) {
                            const fallback = new Date().toISOString().slice(0, 16);
                            if (field === 'start') this.manualSleepStart = fallback;
                            if (field === 'end') this.manualSleepEnd = fallback;
                        }
                    } else {
                        if (field === 'start') this.manualSleepStart = '';
                        if (field === 'end') this.manualSleepEnd = '';
                    }
                },

                toggleEditCurrentEnd(event) {
                    if (event.target.checked) {
                        try {
                            const now = new Date();
                            const tzDate = new Date(now.toLocaleString('en-US', { timeZone: this.currentTimezone }));
                            const pad = (n) => String(n).padStart(2, '0');
                            this.editingLog.formatted_end = `${tzDate.getFullYear()}-${pad(tzDate.getMonth()+1)}-${pad(tzDate.getDate())}T${pad(tzDate.getHours())}:${pad(tzDate.getMinutes())}`;
                        } catch (e) {
                            this.editingLog.formatted_end = new Date().toISOString().slice(0, 16);
                        }
                    } else {
                        this.editingLog.formatted_end = '';
                    }
                },

                get runningSleepLog() {
                    return this.logs.find(l => l.category === 'sleep' && !l.end_time);
                },

                get filteredLogs() {
                    let list = this.logs;
                    if (this.activeTab === 'sleep') list = this.logs.filter(l => l.category === 'sleep');
                    else if (this.activeTab === 'medicine') list = this.logs.filter(l => l.category === 'medicine');
                    else if (this.activeTab === 'memo') list = this.logs.filter(l => l.category === 'memo');
                    return list.slice(0, 30);
                },

                get searchedHistoricalLogs() {
                    let list = [...this.logs];
                    if (this.searchCategory !== 'all') list = list.filter(l => l.category === this.searchCategory);
                    if (this.searchDate) list = list.filter(l => this.getLocalDateString(l.start_time || l.created_at) === this.searchDate);
                    if (this.searchQuery.trim()) {
                        const q = this.searchQuery.toLowerCase();
                        list = list.filter(l => (l.title || '').toLowerCase().includes(q) || (l.notes || '').toLowerCase().includes(q));
                    }
                    return list;
                },

                get medicineLogs() { return this.logs.filter(l => l.category === 'medicine'); },
                get uniqueMedicineCount() { return new Set(this.medicineLogs.map(m => (m.title || '').trim().toLowerCase()).filter(Boolean)).size; },
                get totalMedVolume() { return this.medicineLogs.reduce((sum, m) => sum + (parseFloat(m.amount) || 0), 0).toFixed(1); },

                getLocalDateString(utcDateStr) {
                    try {
                        const d = new Date(utcDateStr);
                        const tzDate = new Date(d.toLocaleString('en-US', { timeZone: this.currentTimezone }));
                        const pad = (n) => String(n).padStart(2, '0');
                        return `${tzDate.getFullYear()}-${pad(tzDate.getMonth()+1)}-${pad(tzDate.getDate())}`;
                    } catch (e) {
                        return utcDateStr ? utcDateStr.slice(0, 10) : '';
                    }
                },

                formatISOForDatetimeLocal(utcDateStr) {
                    if (!utcDateStr) return '';
                    try {
                        const d = new Date(utcDateStr);
                        const tzDate = new Date(d.toLocaleString('en-US', { timeZone: this.currentTimezone }));
                        const pad = (n) => String(n).padStart(2, '0');
                        return `${tzDate.getFullYear()}-${pad(tzDate.getMonth()+1)}-${pad(tzDate.getDate())}T${pad(tzDate.getHours())}:${pad(tzDate.getMinutes())}`;
                    } catch (e) {
                        return utcDateStr.slice(0, 16);
                    }
                },

                get avgSleep7Days() { return this.calculateAverageSleepDays(7); },
                get avgSleep30Days() { return this.calculateAverageSleepDays(30); },
                get avgSleep90Days() { return this.calculateAverageSleepDays(90); },
                get avgSleepYear() { return this.calculateAverageSleepDays(365); },
                get avgSleepAll() {
                    const cleanLogs = this.deduplicateSleepLogs([...this.logs, ...this.allSleepLogsCache]);
                    const splitSegments = this.splitSleepLogsAcrossMidnight(cleanLogs);
                    if (splitSegments.length === 0) return { avg: '0 hrs 0 mins', range: 'No active logs' };
                    
                    let tzNow = new Date(new Date().toLocaleString('en-US', { timeZone: this.currentTimezone }));
                    const pad = (n) => String(n).padStart(2, '0');
                    let todayStr = `${tzNow.getFullYear()}-${pad(tzNow.getMonth()+1)}-${pad(tzNow.getDate())}`;

                    const dailyTotals = {};
                    splitSegments.forEach(seg => {
                        if (seg.dateStr !== todayStr) {
                            dailyTotals[seg.dateStr] = (dailyTotals[seg.dateStr] || 0) + seg.durationMinutes;
                        }
                    });
                    
                    const activeDaysKeys = Object.keys(dailyTotals).sort();
                    if (activeDaysKeys.length === 0) return { avg: '0 hrs 0 mins', range: 'No active logs' };
                    
                    const totalMinsAllDays = Object.values(dailyTotals).reduce((a, b) => a + b, 0);
                    const avgVal = this.formatDurationHoursMins(Math.round(totalMinsAllDays / activeDaysKeys.length));
                    
                    const formatDateLabel = (dStr) => {
                        const parts = dStr.split('-');
                        const d = new Date(parts[0], parts[1] - 1, parts[2]);
                        return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
                    };
                    const rangeVal = `${formatDateLabel(activeDaysKeys[0])} – ${formatDateLabel(activeDaysKeys[activeDaysKeys.length - 1])}`;
                    return { avg: avgVal, range: rangeVal };
                },

                calculateAverageSleepDays(daysCount) {
                    const cleanLogs = this.deduplicateSleepLogs([...this.logs, ...this.allSleepLogsCache]);
                    const splitSegments = this.splitSleepLogsAcrossMidnight(cleanLogs);
                    
                    let totalMins = 0, activeDays = 0;
                    let rangeDates = [];
                    
                    for (let i = daysCount; i >= 1; i--) {
                        let tzNow = new Date(new Date().toLocaleString('en-US', { timeZone: this.currentTimezone }));
                        tzNow.setDate(tzNow.getDate() - i);
                        const pad = (n) => String(n).padStart(2, '0');
                        let dateStr = `${tzNow.getFullYear()}-${pad(tzNow.getMonth()+1)}-${pad(tzNow.getDate())}`;
                        
                        let dayMins = splitSegments.filter(s => s.dateStr === dateStr).reduce((sum, s) => sum + s.durationMinutes, 0);
                        if (dayMins > 0) {
                            totalMins += dayMins;
                            activeDays++;
                            rangeDates.push(tzNow);
                        }
                    }

                    const avgVal = activeDays === 0 ? '0 hrs 0 mins' : this.formatDurationHoursMins(Math.round(totalMins / activeDays));
                    
                    let rangeVal = 'No records in range';
                    if (rangeDates.length > 0) {
                        const formatDateLabel = (d) => d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
                        rangeVal = `${formatDateLabel(rangeDates[0])} – ${formatDateLabel(rangeDates[rangeDates.length - 1])}`;
                    }

                    return { avg: avgVal, range: rangeVal };
                },

                async init() {
                    setInterval(() => {
                        try {
                            this.liveClock = new Date().toLocaleTimeString([], { timeZone: this.currentTimezone, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        } catch (e) { this.liveClock = new Date().toLocaleTimeString(); }
                    }, 1000);

                    const { data } = await supabaseClient.auth.getUser();
                    this.user = data.user;
                    if (this.user) {
                        await this.fetchLogs();
                        await this.fetchHistoricalSleepLogs();
                        this.refreshTodaySleep();
                    }
                    supabaseClient.auth.onAuthStateChange(async (event, session) => {
                        this.user = session?.user || null;
                        if (this.user) {
                            await this.fetchLogs();
                            await this.fetchHistoricalSleepLogs();
                            this.refreshTodaySleep();
                        }
                    });
                },

                async login() {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email: this.authEmail, password: this.authPassword });
                    if (error) this.authError = error.message;
                },
                async signup() {
                    const { error } = await supabaseClient.auth.signUp({ email: this.authEmail, password: this.authPassword });
                    if (error) this.authError = error.message;
                    else alert('Registration successful!');
                },
                async logout() {
                    await supabaseClient.auth.signOut();
                    this.logs = [];
                    this.historicalSleepLogs = [];
                    this.allSleepLogsCache = [];
                },

                async fetchLogs() {
                    const { data, error } = await supabaseClient
                        .from('baby_logs')
                        .select('*')
                        .order('start_time', { ascending: false });
                    
                    if (error) {
                        console.error('Error fetching logs:', error);
                        return;
                    }
                    this.logs = data || [];
                },

                async fetchHistoricalSleepLogs() {
                    this.isLoadingHistorical = true;

                    const { data } = await supabaseClient
                        .from('baby_logs')
                        .select('*')
                        .eq('category', 'sleep')
                        .order('start_time', { ascending: false });

                    const allSleep = data || [];
                    this.allSleepLogsCache = allSleep;

                    const cutoffDate = new Date();
                    cutoffDate.setDate(cutoffDate.getDate() - 14);

                    this.historicalSleepLogs = allSleep.filter(l => l.start_time && new Date(l.start_time) < cutoffDate);
                    this.isLoadingHistorical = false;
                },

                formatDurationHoursMins(totalMins) {
                    const h = Math.floor(totalMins / 60), m = totalMins % 60;
                    return h === 0 ? `${m} mins` : `${h} hrs ${m} mins`;
                },

                formatDateInTZ(dateStr) {
                    try { return new Date(dateStr).toLocaleString([], { timeZone: this.currentTimezone, month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
                    catch (e) { return dateStr; }
                },
                formatTimeInTZ(dateStr) {
                    try { return new Date(dateStr).toLocaleTimeString([], { timeZone: this.currentTimezone, hour: '2-digit', minute: '2-digit' }); }
                    catch (e) { return dateStr; }
                },

                formatLogDetails(log) {
                    if (log.category === 'medicine') {
                        return `${log.title || 'Medicine'} ${log.amount ? '- ' + log.amount + ' ' + (log.unit || '') : ''}`;
                    } else if (log.category === 'memo') {
                        return log.notes || 'Note entry';
                    }
                    return '';
                },

                async saveManualSleep() {
                    if (!this.manualSleepStart) { alert('Please enter a start time.'); return; }
                    const startUtc = new Date(this.manualSleepStart).toISOString();
                    let endUtc = null;
                    let durationMins = 0;

                    if (!this.manualSleepIsRunning) {
                        if (!this.manualSleepEnd) { alert('Please enter an end time or select "Currently Running".'); return; }
                        endUtc = new Date(this.manualSleepEnd).toISOString();
                        durationMins = Math.max(1, Math.round((new Date(endUtc) - new Date(startUtc)) / 60000));
                    }

                    const { error } = await supabaseClient.from('baby_logs').insert([{
                        user_id: this.user.id,
                        category: 'sleep',
                        start_time: startUtc,
                        end_time: endUtc,
                        duration_minutes: durationMins,
                        notes: this.sleepNote
                    }]);

                    if (error) { alert('Error saving sleep: ' + error.message); return; }
                    
                    this.manualSleepStart = '';
                    this.manualSleepEnd = '';
                    this.manualSleepIsRunning = false;
                    this.sleepNote = '';
                    await this.fetchLogs();
                    this.refreshTodaySleep();
                    if (this.renderedTabs['sleep_stats']) this.renderSleepChart();
                },

                async saveMedicine() {
                    if (!this.medTitle) { alert('Please enter medicine name.'); return; }
                    const { error } = await supabaseClient.from('baby_logs').insert([{
                        user_id: this.user.id,
                        category: 'medicine',
                        title: this.medTitle,
                        amount: this.medAmount ? parseFloat(this.medAmount) : null,
                        unit: this.medUnit,
                        start_time: new Date().toISOString()
                    }]);

                    if (error) { alert('Error saving medicine: ' + error.message); return; }
                    this.medTitle = ''; this.medAmount = '';
                    await this.fetchLogs();
                    if (this.renderedTabs['med_stats']) this.renderMedChart();
                },

                async saveMemo() {
                    if (!this.memoText) { alert('Please enter memo text.'); return; }
                    const { error } = await supabaseClient.from('baby_logs').insert([{
                        user_id: this.user.id,
                        category: 'memo',
                        notes: this.memoText,
                        start_time: new Date().toISOString()
                    }]);

                    if (error) { alert('Error saving memo: ' + error.message); return; }
                    this.memoText = '';
                    await this.fetchLogs();
                },

                async stopRunningLog(log) {
                    const now = new Date();
                    const start = new Date(log.start_time);
                    const durationMins = Math.max(1, Math.round((now - start) / 60000));

                    const { error } = await supabaseClient.from('baby_logs').update({
                        end_time: now.toISOString(),
                        duration_minutes: durationMins
                    }).eq('id', log.id);

                    if (error) { alert('Error stopping timer: ' + error.message); return; }
                    await this.fetchLogs();
                    this.refreshTodaySleep();
                    if (this.renderedTabs['sleep_stats']) this.renderSleepChart();
                },

                async deleteLog(id) {
                    if (!confirm('Are you sure you want to delete this log?')) return;
                    const { error } = await supabaseClient.from('baby_logs').delete().eq('id', id);
                    if (error) { alert('Error deleting log: ' + error.message); return; }
                    await this.fetchLogs();
                    await this.fetchHistoricalSleepLogs();
                    this.refreshTodaySleep();
                    if (this.renderedTabs['sleep_stats']) this.renderSleepChart();
                    if (this.renderedTabs['historical_sleep']) this.renderHistoricalChart();
                },

                async deleteAllCategoryLogs(category) {
                    if (!confirm(`Are you sure you want to delete ALL ${category} logs?`)) return;
                    const { error } = await supabaseClient.from('baby_logs').delete().eq('category', category);
                    if (error) { alert('Error deleting logs: ' + error.message); return; }
                    await this.fetchLogs();
                    await this.fetchHistoricalSleepLogs();
                    this.refreshTodaySleep();
                    if (this.renderedTabs['sleep_stats']) this.renderSleepChart();
                    if (this.renderedTabs['historical_sleep']) this.renderHistoricalChart();
                },

                openEditModal(log) {
                    this.editingLog = { ...log };
                    if (log.start_time) this.editingLog.formatted_start = this.formatISOForDatetimeLocal(log.start_time);
                    if (log.end_time) this.editingLog.formatted_end = this.formatISOForDatetimeLocal(log.end_time);
                    this.showEditModal = true;
                },

                async saveEditModal() {
                    const updates = { notes: this.editingLog.notes };
                    if (this.editingLog.category === 'medicine') {
                        if (this.editingLog.title !== undefined) updates.title = this.editingLog.title;
                        if (this.editingLog.amount !== undefined) updates.amount = this.editingLog.amount !== '' ? parseFloat(this.editingLog.amount) : null;
                        if (this.editingLog.unit !== undefined) updates.unit = this.editingLog.unit;
                    }
                    if (this.editingLog.formatted_start) updates.start_time = new Date(this.editingLog.formatted_start).toISOString();
                    
                    if (this.editingLog.category === 'sleep' && this.editingLog.formatted_end) {
                        const endUtc = new Date(this.editingLog.formatted_end).toISOString();
                        updates.end_time = endUtc;
                        updates.duration_minutes = Math.max(1, Math.round((new Date(endUtc) - new Date(updates.start_time)) / 60000));
                    }

                    const { error } = await supabaseClient.from('baby_logs').update(updates).eq('id', this.editingLog.id);
                    if (error) { alert('Error updating log: ' + error.message); return; }

                    this.showEditModal = false;
                    await this.fetchLogs();
                    await this.fetchHistoricalSleepLogs();
                    this.refreshTodaySleep();
                    if (this.renderedTabs['historical_sleep']) await this.fetchHistoricalSleepLogs();
                    if (this.renderedTabs['sleep_stats']) this.renderSleepChart();
                    if (this.renderedTabs['historical_sleep']) this.renderHistoricalChart();
                },

                async exportCSV() {
                    const { data } = await supabaseClient.from('baby_logs').select('*').order('start_time', { ascending: false });
                    if (!data || data.length === 0) { alert('No logs found to export.'); return; }
                    const csv = Papa.unparse(data);
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.setAttribute('download', `baby_logs_export_${new Date().toISOString().slice(0, 10)}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                },

                deduplicateSleepLogs(logsList) {
                    const seenIds = new Set();
                    const uniqueById = [];

                    logsList.forEach(log => {
                        if (log.id) {
                            if (!seenIds.has(log.id)) {
                                seenIds.add(log.id);
                                uniqueById.push(log);
                            }
                        } else {
                            uniqueById.push(log);
                        }
                    });

                    const timeGroupMap = {};
                    uniqueById.forEach(log => {
                        if (log.category !== 'sleep') return;
                        const startKey = log.start_time ? new Date(log.start_time).toISOString().slice(0, 16) : '';
                        const endKey = log.end_time ? new Date(log.end_time).toISOString().slice(0, 16) : '';
                        const signature = `${startKey}_${endKey}`;

                        if (!timeGroupMap[signature]) {
                            timeGroupMap[signature] = log;
                        } else {
                            const existingDuration = timeGroupMap[signature].duration_minutes || 0;
                            const currentDuration = log.duration_minutes || 0;
                            if (currentDuration > existingDuration) {
                                timeGroupMap[signature] = log;
                            }
                        }
                    });

                    const nonSleepLogs = uniqueById.filter(l => l.category !== 'sleep');
                    const deduplicatedSleepLogs = Object.values(timeGroupMap);

                    return [...nonSleepLogs, ...deduplicatedSleepLogs];
                },

                splitSleepLogsAcrossMidnight(logsToSplit) {
                    const splitSegments = [];
                    const now = new Date();
                    
                    const sleepLogs = logsToSplit.filter(l => l.category === 'sleep' && l.start_time);

                    sleepLogs.forEach(log => {
                        let currStart = new Date(log.start_time);
                        let end = log.end_time ? new Date(log.end_time) : now;
                        if (end < currStart) end = now;

                        let totalLogMinutes = Math.max(1, Math.round((end - currStart) / 60000));
                        let totalLogHours = totalLogMinutes / 60;
                        let parentColor = totalLogHours >= 8 ? '#34d399' : totalLogHours >= 4 ? '#60a5fa' : totalLogHours >= 1 ? '#fbbf24' : '#f472b6';

                        while (currStart < end) {
                            const tzStart = new Date(currStart.toLocaleString('en-US', { timeZone: this.currentTimezone }));
                            const nextMidnight = new Date(tzStart);
                            nextMidnight.setHours(24, 0, 0, 0);

                            let segEnd = new Date(currStart.getTime() + (nextMidnight - tzStart));
                            if (segEnd > end) segEnd = end;

                            const segMins = Math.max(1, Math.round((segEnd - currStart) / 60000));

                            splitSegments.push({
                                dateStr: this.getLocalDateString(currStart.toISOString()),
                                durationMinutes: segMins,
                                sourceColor: parentColor
                            });
                            currStart = segEnd;
                        }
                    });
                    return splitSegments;
                },

                renderSleepChart() {
                    const ctx = document.getElementById('sleepChart');
                    if (!ctx) return;

                    if (window.sleepChartInstance) {
                        window.sleepChartInstance.destroy();
                        window.sleepChartInstance = null;
                    }

                    const cleanLogs = this.deduplicateSleepLogs([...this.logs, ...this.allSleepLogsCache]);
                    const splitSegments = this.splitSleepLogsAcrossMidnight(cleanLogs);
                    const daysCount = this.sleepChartDaysWindow;
                    const labels = [], dailyTotalMins = new Array(daysCount).fill(0);
                    const dailySegmentsMap = {}, datesList = [];

                    for (let i = daysCount - 1; i >= 0; i--) {
                        let tzNow = new Date(new Date().toLocaleString('en-US', { timeZone: this.currentTimezone }));
                        tzNow.setDate(tzNow.getDate() - i);
                        const pad = (n) => String(n).padStart(2, '0');
                        let dateStr = `${tzNow.getFullYear()}-${pad(tzNow.getMonth()+1)}-${pad(tzNow.getDate())}`;
                        datesList.push(dateStr);
                        labels.push(`${tzNow.toLocaleDateString([], { weekday: 'short' })}, ${tzNow.toLocaleDateString([], { month: 'short', day: 'numeric' })}`);
                        dailySegmentsMap[dateStr] = splitSegments.filter(s => s.dateStr === dateStr);
                    }

                    let maxSessions = 1;
                    datesList.forEach(d => { if ((dailySegmentsMap[d] || []).length > maxSessions) maxSessions = dailySegmentsMap[d].length; });

                    const datasets = [];
                    for (let s = 0; s < maxSessions; s++) {
                        datasets.push({
                            data: new Array(daysCount).fill(0),
                            durationMinsArray: new Array(daysCount).fill(0),
                            backgroundColor: new Array(daysCount).fill('#60a5fa'),
                            borderRadius: 4
                        });
                    }

                    let maxHours = 12;
                    datesList.forEach((dStr, idx) => {
                        const segs = dailySegmentsMap[dStr] || [];
                        let daySum = 0;
                        segs.forEach(s => { daySum += s.durationMinutes; });
                        dailyTotalMins[idx] = daySum;

                        segs.forEach((seg, sIdx) => {
                            if (sIdx < maxSessions) {
                                datasets[sIdx].data[idx] = parseFloat((seg.durationMinutes / 60).toFixed(2));
                                datasets[sIdx].durationMinsArray[idx] = seg.durationMinutes;
                                datasets[sIdx].backgroundColor[idx] = seg.sourceColor;
                            }
                        });

                        if ((daySum / 60) > maxHours) maxHours = Math.ceil(daySum / 60);
                    });

                    window.sleepChartInstance = new Chart(ctx.getContext('2d'), {
                        type: 'bar',
                        data: { labels, datasets: datasets.filter(ds => ds.data.some(v => v > 0)) },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false,
                            devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
                            resizeDelay: 150,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    callbacks: {
                                        title: (items) => {
                                            const total = dailyTotalMins[items[0].dataIndex];
                                            return `${items[0].label} (Daily Total: ${Math.floor(total/60)} hrs ${total%60} mins)`;
                                        },
                                        label: (context) => {
                                            const mins = context.dataset.durationMinsArray[context.dataIndex];
                                            return mins ? ` Segment: ${Math.floor(mins/60)} hrs ${mins%60} mins` : '';
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: { stacked: true },
                                y: { stacked: true, min: 0, max: maxHours, ticks: { stepSize: 1 } }
                            }
                        }
                    });
                },

                renderHistoricalChart() {
                    const ctx = document.getElementById('historicalSleepChart');
                    if (!ctx) return;

                    if (window.historicalChartInstance) {
                        window.historicalChartInstance.destroy();
                        window.historicalChartInstance = null;
                    }

                    const rawCombinedLogs = [...this.logs, ...this.allSleepLogsCache];
                    const cleanCombinedLogs = this.deduplicateSleepLogs(rawCombinedLogs);

                    const splitSegments = this.splitSleepLogsAcrossMidnight(cleanCombinedLogs);
                    const daysCount = this.historicalChartDaysWindow;
                    const labels = [], dailyTotalMins = new Array(daysCount).fill(0);
                    const dailySegmentsMap = {}, datesList = [];

                    for (let i = daysCount - 1; i >= 0; i--) {
                        let tzNow = new Date(new Date().toLocaleString('en-US', { timeZone: this.currentTimezone }));
                        tzNow.setDate(tzNow.getDate() - i);
                        const pad = (n) => String(n).padStart(2, '0');
                        let dateStr = `${tzNow.getFullYear()}-${pad(tzNow.getMonth()+1)}-${pad(tzNow.getDate())}`;
                        datesList.push(dateStr);
                        labels.push(`${tzNow.toLocaleDateString([], { weekday: 'short' })}, ${tzNow.toLocaleDateString([], { month: 'short', day: 'numeric', year: '2-digit' })}`);
                        dailySegmentsMap[dateStr] = splitSegments.filter(s => s.dateStr === dateStr);
                    }

                    let maxSessions = 1;
                    datesList.forEach(d => { if ((dailySegmentsMap[d] || []).length > maxSessions) maxSessions = dailySegmentsMap[d].length; });

                    const datasets = [];
                    for (let s = 0; s < maxSessions; s++) {
                        datasets.push({
                            data: new Array(daysCount).fill(0),
                            durationMinsArray: new Array(daysCount).fill(0),
                            backgroundColor: new Array(daysCount).fill('#60a5fa'),
                            borderRadius: 4
                        });
                    }

                    let maxHours = 12;
                    datesList.forEach((dStr, idx) => {
                        const segs = dailySegmentsMap[dStr] || [];
                        let daySum = 0;
                        segs.forEach(s => { daySum += s.durationMinutes; });
                        dailyTotalMins[idx] = daySum;

                        segs.forEach((seg, sIdx) => {
                            if (sIdx < maxSessions) {
                                datasets[sIdx].data[idx] = parseFloat((seg.durationMinutes / 60).toFixed(2));
                                datasets[sIdx].durationMinsArray[idx] = seg.durationMinutes;
                                datasets[sIdx].backgroundColor[idx] = seg.sourceColor;
                            }
                        });

                        if ((daySum / 60) > maxHours) maxHours = Math.ceil(daySum / 60);
                    });

                    window.historicalChartInstance = new Chart(ctx.getContext('2d'), {
                        type: 'bar',
                        data: { labels, datasets: datasets.filter(ds => ds.data.some(v => v > 0)) },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false,
                            devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
                            resizeDelay: 150,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    callbacks: {
                                        title: (items) => {
                                            const total = dailyTotalMins[items[0].dataIndex];
                                            return `${items[0].label} (Daily Total: ${Math.floor(total/60)} hrs ${total%60} mins)`;
                                        },
                                        label: (context) => {
                                            const mins = context.dataset.durationMinsArray[context.dataIndex];
                                            return mins ? ` Segment: ${Math.floor(mins/60)} hrs ${mins%60} mins` : '';
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: { stacked: true },
                                y: { stacked: true, min: 0, max: maxHours, ticks: { stepSize: 1 } }
                            }
                        }
                    });
                },

                renderMedChart() {
                    const ctx = document.getElementById('medChart');
                    if (!ctx) return;
                    if (window.medChartInstance) { window.medChartInstance.destroy(); window.medChartInstance = null; }

                    const medCounts = {};
                    this.medicineLogs.forEach(m => { medCounts[m.title || 'Other'] = (medCounts[m.title || 'Other'] || 0) + 1; });

                    window.medChartInstance = new Chart(ctx.getContext('2d'), {
                        type: 'bar',
                        data: {
                            labels: Object.keys(medCounts).length ? Object.keys(medCounts) : ['No Data'],
                            datasets: [{ data: Object.values(medCounts).length ? Object.values(medCounts) : [0], backgroundColor: '#34d399', borderRadius: 8 }]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false,
                            devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
                            resizeDelay: 150,
                            plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                        }
                    });
                }
            }
        }
    </script>
</body>
