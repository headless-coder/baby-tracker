<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Tracker (Nara Alternative)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse for robust CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-amber-50/50 text-slate-800 font-sans antialiased min-h-screen flex flex-col" x-data="babyApp()">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-amber-100 shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-100 text-indigo-600 p-2 rounded-xl">
                    <i class="fa-solid fa-baby text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-pink-500 bg-clip-text text-transparent">BabyLogs</h1>
                    <!-- Live Time Clock -->
                    <div class="text-[11px] font-mono text-slate-500" x-text="'Clock (' + currentTimezone + '): ' + liveClock"></div>
                </div>
            </div>
            <template x-if="user">
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-slate-500 hidden sm:inline" x-text="user.email"></span>
                    <button @click="logout()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-medium transition">Logout</button>
                </div>
            </template>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">

        <!-- AUTH SCREEN -->
        <template x-if="!user">
            <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-amber-100 mt-10">
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold text-slate-800">Welcome Back</h2>
                    <p class="text-sm text-slate-500">Sign in or create your free account to track your baby's logs</p>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Email</label>
                        <input type="email" x-model="authEmail" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Password</label>
                        <input type="password" x-model="authPassword" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div class="flex space-x-3 pt-2">
                        <button @click="login()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-xl transition">Sign In</button>
                        <button @click="signup()" class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-medium py-2 rounded-xl transition">Register</button>
                    </div>
                    <p class="text-xs text-red-500 text-center mt-2" x-text="authError"></p>
                </div>
            </div>
        </template>

        <!-- APP DASHBOARD -->
        <template x-if="user">
            <div>
                <!-- Navigation Tabs -->
                <div class="flex space-x-2 border-b border-amber-200 mb-6 pb-2 overflow-x-auto">
                    <button @click="activeTab = 'all'" :class="activeTab === 'all' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-amber-100'" class="px-4 py-2 rounded-xl font-medium text-sm transition whitespace-nowrap">
                        <i class="fa-solid fa-list mr-1.5"></i> All Logs
                    </button>
                    <button @click="activeTab = 'sleep'" :class="activeTab === 'sleep' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-amber-100'" class="px-4 py-2 rounded-xl font-medium text-sm transition whitespace-nowrap">
                        <i class="fa-solid fa-bed mr-1.5"></i> Sleep Logs
                    </button>
                    <button @click="activeTab = 'medicine'" :class="activeTab === 'medicine' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-amber-100'" class="px-4 py-2 rounded-xl font-medium text-sm transition whitespace-nowrap">
                        <i class="fa-solid fa-pills mr-1.5"></i> Medicine Logs
                    </button>
                    <button @click="activeTab = 'memo'" :class="activeTab === 'memo' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-amber-100'" class="px-4 py-2 rounded-xl font-medium text-sm transition whitespace-nowrap">
                        <i class="fa-solid fa-note-sticky mr-1.5"></i> Memo Logs
                    </button>
                    <button @click="activeTab = 'sleep_stats'; $nextTick(() => renderSleepChart())" :class="activeTab === 'sleep_stats' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-amber-100'" class="px-4 py-2 rounded-xl font-medium text-sm transition whitespace-nowrap">
                        <i class="fa-solid fa-chart-bar mr-1.5"></i> Sleep Analytics
                    </button>
                    <button @click="activeTab = 'med_stats'; $nextTick(() => renderMedChart())" :class="activeTab === 'med_stats' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-amber-100'" class="px-4 py-2 rounded-xl font-medium text-sm transition whitespace-nowrap">
                        <i class="fa-solid fa-chart-pie mr-1.5"></i> Medicine Analytics
                    </button>
                    <button @click="activeTab = 'settings'" :class="activeTab === 'settings' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-amber-100'" class="px-4 py-2 rounded-xl font-medium text-sm transition whitespace-nowrap">
                        <i class="fa-solid fa-gear mr-1.5"></i> Settings
                    </button>
                    <button @click="activeTab = 'import'" :class="activeTab === 'import' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-amber-100'" class="px-4 py-2 rounded-xl font-medium text-sm transition whitespace-nowrap">
                        <i class="fa-solid fa-file-csv mr-1.5"></i> CSV Import/Export
                    </button>
                </div>

                <!-- QUICK LOG CARDS SECTION -->
                <div x-show="['all', 'sleep', 'medicine', 'memo'].includes(activeTab)" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        
                        <!-- Manual Sleep Logging Card (No Timer) -->
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-indigo-100 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between mb-3">
                                    <span class="font-semibold text-indigo-900 flex items-center"><i class="fa-solid fa-bed text-indigo-500 mr-2"></i> Manual Sleep Log</span>
                                </div>

                                <div class="space-y-3 my-2">
                                    <div>
                                        <div class="flex justify-between items-center mb-1">
                                            <label class="text-[10px] uppercase font-semibold text-slate-400">Start Date & Time (<span x-text="currentTimezone"></span>)</label>
                                            <div class="flex items-center space-x-1">
                                                <input type="checkbox" id="useCurrentStart" @change="toggleCurrentTime($event)" class="rounded text-indigo-600 focus:ring-indigo-500">
                                                <label for="useCurrentStart" class="text-[11px] text-indigo-600 font-medium cursor-pointer">Use Current Time</label>
                                            </div>
                                        </div>
                                        <input type="datetime-local" x-model="manualSleepStart" class="w-full text-xs px-2 py-1.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <input type="checkbox" id="isRunningEnd" x-model="manualSleepIsRunning" class="rounded text-indigo-600 focus:ring-indigo-500">
                                        <label for="isRunningEnd" class="text-xs text-indigo-700 font-medium cursor-pointer">Currently Running (End Later)</label>
                                    </div>
                                    <div x-show="!manualSleepIsRunning">
                                        <label class="text-[10px] uppercase font-semibold text-slate-400">End Date & Time (<span x-text="currentTimezone"></span>)</label>
                                        <input type="datetime-local" x-model="manualSleepEnd" class="w-full text-xs px-2 py-1.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                    </div>
                                </div>

                                <input type="text" x-model="sleepNote" placeholder="Sleep notes / tag..." class="w-full text-xs px-2.5 py-1.5 border rounded-lg my-2 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            </div>

                            <div class="pt-2">
                                <button @click="saveManualSleep()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2 rounded-xl transition" x-text="manualSleepIsRunning ? 'Start Running Sleep' : 'Save Sleep Entry'"></button>
                            </div>
                        </div>

                        <!-- Quick Medicine Card -->
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100 flex flex-col justify-between">
                            <div>
                                <span class="font-semibold text-emerald-900 flex items-center mb-3"><i class="fa-solid fa-pills text-emerald-500 mr-2"></i> Quick Medicine</span>
                                <input type="text" x-model="medTitle" placeholder="Medicine Name (e.g. Tylenol)" class="w-full text-xs px-2.5 py-1.5 border rounded-lg mb-2 focus:outline-none focus:ring-1 focus:ring-emerald-500">
                                <div class="flex space-x-2 mb-3">
                                    <input type="number" step="0.1" x-model="medAmount" placeholder="Amount" class="w-1/2 text-xs px-2.5 py-1.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-emerald-500">
                                    <input type="text" x-model="medUnit" placeholder="Unit (ml/mg)" class="w-1/2 text-xs px-2.5 py-1.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-emerald-500">
                                </div>
                            </div>
                            <button @click="saveMedicine()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 rounded-xl transition">Log Medicine</button>
                        </div>

                        <!-- Quick Memo Card -->
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-amber-100 flex flex-col justify-between">
                            <div>
                                <span class="font-semibold text-amber-900 flex items-center mb-3"><i class="fa-solid fa-note-sticky text-amber-500 mr-2"></i> Quick Memo</span>
                                <textarea x-model="memoText" placeholder="Add milestone, mood or notes..." rows="3" class="w-full text-xs px-2.5 py-1.5 border rounded-lg mb-3 resize-none focus:outline-none focus:ring-1 focus:ring-amber-500"></textarea>
                            </div>
                            <button @click="saveMemo()" class="w-full bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold py-2 rounded-xl transition">Save Memo</button>
                        </div>
                    </div>

                    <!-- Memo Filter Controls -->
                    <template x-if="activeTab === 'memo'">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-amber-100 flex flex-col sm:flex-row items-center justify-between gap-3">
                            <span class="font-bold text-slate-800 text-sm">Filter & Sort Memos</span>
                            <div class="flex items-center gap-2 w-full sm:w-auto">
                                <input type="text" x-model="memoSearch" placeholder="Search memo text..." class="text-xs px-3 py-1.5 border rounded-xl focus:outline-none focus:ring-1 focus:ring-amber-500 w-full sm:w-48">
                                <select x-model="memoSortBy" class="text-xs px-3 py-1.5 border rounded-xl focus:outline-none focus:ring-1 focus:ring-amber-500">
                                    <option value="date_desc">Date (Newest First)</option>
                                    <option value="date_asc">Date (Oldest First)</option>
                                </select>
                            </div>
                        </div>
                    </template>

                    <!-- Logs Feed List -->
                    <div class="bg-white rounded-2xl shadow-sm border border-amber-100 p-5">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-bold text-slate-800 flex items-center space-x-2">
                                <span x-text="activeTab === 'all' ? 'All Recent Logs' : (activeTab === 'sleep' ? 'Sleep Logs' : (activeTab === 'medicine' ? 'Medicine Logs' : 'Memo Logs'))"></span>
                                <span class="text-xs font-normal text-slate-400" x-text="'(' + filteredLogs.length + ' entries)'"></span>
                            </h3>

                            <template x-if="['sleep', 'medicine', 'memo'].includes(activeTab) && filteredLogs.length > 0">
                                <button @click="deleteAllCategoryLogs(activeTab)" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-3 py-1.5 rounded-xl font-medium transition flex items-center">
                                    <i class="fa-solid fa-trash-can mr-1.5"></i> Delete All <span class="capitalize ml-1" x-text="activeTab"></span> Logs
                                </button>
                            </template>
                        </div>

                        <template x-if="filteredLogs.length === 0">
                            <p class="text-sm text-slate-400 text-center py-8">No logs found for this view.</p>
                        </template>
                        <div class="space-y-3">
                            <template x-for="log in filteredLogs" :key="log.id">
                                <div class="flex items-center justify-between p-3 rounded-xl border border-slate-100 hover:bg-slate-50 transition" :class="!log.end_time && log.category === 'sleep' ? 'bg-indigo-50/50 border-indigo-200' : ''">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white"
                                            :class="{
                                                'bg-indigo-500': log.category === 'sleep',
                                                'bg-emerald-500': log.category === 'medicine',
                                                'bg-amber-500': log.category === 'memo'
                                            }">
                                            <i class="fa-solid" :class="{
                                                'fa-bed': log.category === 'sleep',
                                                'fa-pills': log.category === 'medicine',
                                                'fa-note-sticky': log.category === 'memo'
                                            }"></i>
                                        </div>
                                        <div>
                                            <div class="text-sm font-semibold text-slate-800 capitalize flex items-center gap-2">
                                                <span x-text="log.category"></span>
                                                <template x-if="!log.end_time && log.category === 'sleep'">
                                                    <span class="text-[10px] bg-rose-500 text-white font-bold px-2 py-0.5 rounded-full animate-pulse">Running Now</span>
                                                </template>
                                            </div>
                                            <template x-if="log.category === 'sleep'">
                                                <div class="text-xs text-indigo-600 font-medium">
                                                    <span x-text="formatTimeInTZ(log.start_time)"></span> – 
                                                    <span x-text="log.end_time ? formatTimeInTZ(log.end_time) : 'Active'"></span> 
                                                    <template x-if="log.end_time">
                                                        <span>(<span x-text="formatDurationHoursMins(log.duration_minutes)"></span>)</span>
                                                    </template>
                                                </div>
                                            </template>
                                            <template x-if="log.category !== 'sleep'">
                                                <div class="text-xs text-slate-500" x-text="formatLogDetails(log)"></div>
                                            </template>
                                            <template x-if="log.notes && log.category !== 'memo'">
                                                <div class="text-xs text-slate-600 italic mt-0.5" x-text="'- ' + log.notes"></div>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <template x-if="!log.end_time && log.category === 'sleep'">
                                            <button @click="stopRunningLog(log)" class="bg-rose-500 hover:bg-rose-600 text-white text-xs px-2.5 py-1 rounded-lg font-semibold transition mr-2">Stop Sleep</button>
                                        </template>
                                        
                                        <span class="text-xs text-slate-400 mr-1" x-text="formatDateInTZ(log.start_time || log.created_at)"></span>
                                        
                                        <button @click="openEditModal(log)" class="text-slate-400 hover:text-indigo-600 p-1 transition" title="Edit Log"><i class="fa-solid fa-pen-to-square"></i></button>
                                        <button @click="deleteLog(log.id)" class="text-slate-300 hover:text-rose-500 p-1 transition" title="Delete Log"><i class="fa-solid fa-trash-can"></i></button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- TAB: SLEEP ANALYTICS CHART & AVERAGES -->
                <div x-show="activeTab === 'sleep_stats'" class="space-y-6">
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-indigo-100">
                            <div class="text-[11px] font-semibold text-slate-400 uppercase">Avg Sleep (Last 7 Days)</div>
                            <div class="text-xl font-bold text-indigo-600 mt-1" x-text="avgSleep7Days"></div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-indigo-100">
                            <div class="text-[11px] font-semibold text-slate-400 uppercase">Avg Sleep (Last 30 Days)</div>
                            <div class="text-xl font-bold text-indigo-600 mt-1" x-text="avgSleep30Days"></div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-indigo-100">
                            <div class="text-[11px] font-semibold text-slate-400 uppercase">Avg Sleep (Last Year)</div>
                            <div class="text-xl font-bold text-indigo-600 mt-1" x-text="avgSleepYear"></div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-indigo-100">
                            <div class="text-[11px] font-semibold text-slate-400 uppercase">Avg Sleep (All Time)</div>
                            <div class="text-xl font-bold text-indigo-600 mt-1" x-text="avgSleepAll"></div>
                        </div>
                    </div>

                    <!-- Stacked Sleep Chart & Custom Legend -->
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-amber-100 space-y-4">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div>
                                <h3 class="font-bold text-slate-800">7-Day Stacked Sleep Duration Trend</h3>
                                <p class="text-xs text-slate-400">Color-coded by session length</p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button @click="shiftDays(-1); renderSleepChart()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-medium transition">
                                    <i class="fa-solid fa-chevron-left mr-1"></i> Previous 1 Day
                                </button>
                                <button @click="resetDays(); renderSleepChart()" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-2.5 py-1.5 rounded-lg font-medium transition">
                                    Today
                                </button>
                                <button @click="shiftDays(1); renderSleepChart()" :disabled="chartOffsetDays >= 0" :class="chartOffsetDays >= 0 ? 'opacity-40 cursor-not-allowed' : ''" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-medium transition">
                                    Next 1 Day <i class="fa-solid fa-chevron-right ml-1"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Custom Legend with Circular Swatches -->
                        <div class="flex flex-wrap items-center gap-4 text-xs font-medium text-slate-600 pt-1 border-t border-slate-100">
                            <div class="flex items-center space-x-1.5"><span class="w-3.5 h-3.5 rounded-full bg-[#34d399] inline-block"></span><span>&ge; 8 hours (Green)</span></div>
                            <div class="flex items-center space-x-1.5"><span class="w-3.5 h-3.5 rounded-full bg-[#60a5fa] inline-block"></span><span>4 to 8 hours (Blue)</span></div>
                            <div class="flex items-center space-x-1.5"><span class="w-3.5 h-3.5 rounded-full bg-[#fbbf24] inline-block"></span><span>1 to 4 hours (Yellow)</span></div>
                            <div class="flex items-center space-x-1.5"><span class="w-3.5 h-3.5 rounded-full bg-[#f472b6] inline-block"></span><span>&lt; 1 hour (Light Pink)</span></div>
                        </div>

                        <div class="relative h-80">
                            <canvas id="sleepChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- TAB: MEDICINE ANALYTICS & DETAILED TABLE -->
                <div x-show="activeTab === 'med_stats'" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-100">
                            <div class="text-xs font-semibold text-slate-400 uppercase">Total Doses Logged</div>
                            <div class="text-2xl font-bold text-emerald-600 mt-1" x-text="medicineLogs.length"></div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-100">
                            <div class="text-xs font-semibold text-slate-400 uppercase">Unique Medications</div>
                            <div class="text-2xl font-bold text-emerald-600 mt-1" x-text="uniqueMedicineCount"></div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-100">
                            <div class="text-xs font-semibold text-slate-400 uppercase">Total Volume (ML)</div>
                            <div class="text-2xl font-bold text-emerald-600 mt-1" x-text="totalMedVolume + ' ml'"></div>
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
                        <h3 class="font-bold text-slate-800 mb-4">Medication Dose Counts</h3>
                        <div class="relative h-64">
                            <canvas id="medChart"></canvas>
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                            <h3 class="font-bold text-slate-800">Medicine Activity Log</h3>
                            <div class="flex flex-wrap items-center gap-2">
                                <input type="text" x-model="medSearch" placeholder="Search medicine or notes..." class="text-xs px-3 py-1.5 border rounded-xl focus:outline-none focus:ring-1 focus:ring-emerald-500">
                                
                                <select x-model="medSortBy" class="text-xs px-3 py-1.5 border rounded-xl focus:outline-none focus:ring-1 focus:ring-emerald-500">
                                    <option value="date_desc">Date (Newest First)</option>
                                    <option value="date_asc">Date (Oldest First)</option>
                                    <option value="name_asc">Name (A-Z)</option>
                                    <option value="amount_desc">Amount (High to Low)</option>
                                </select>
                            </div>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs text-slate-600 border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase">
                                        <th class="p-3">Date & Time</th>
                                        <th class="p-3">Medicine</th>
                                        <th class="p-3">Amount / Dose</th>
                                        <th class="p-3">Notes</th>
                                        <th class="p-3 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="med in processedMedLogs" :key="med.id">
                                        <tr class="border-b border-slate-100 hover:bg-emerald-50/30 transition">
                                            <td class="p-3 whitespace-nowrap" x-text="formatDateInTZ(med.start_time || med.created_at)"></td>

    <!-- Supabase & App Logic Script -->
    <script>
        const SUPABASE_URL = 'https://gzrpvwpyeekjyycfalpz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6cnB2d3B5ZWVranl5Y2ZhbHB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MjcxODMsImV4cCI6MjEwNzUwMzE4M30.c-HAoPBjw0uC1LxBvD1yPWleWldiAZ6NeFIRTdir7l0';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function babyApp() {
            return {
                user: null,
                authEmail: '',
                authPassword: '',
                authError: '',
                activeTab: 'all',
                logs: [],
                
                // Timezone configuration
                currentTimezone: localStorage.getItem('baby_tz') || 'America/Los_Angeles',
                liveClock: '',

                // Manual Sleep State
                manualSleepStart: '',
                manualSleepEnd: '',
                manualSleepIsRunning: false,
                sleepNote: '',

                // Medicine form state
                medTitle: '',
                medAmount: '',
                medUnit: 'ml',

                // Medicine Listing Search & Sort State
                medSearch: '',
                medSortBy: 'date_desc',

                // Memo Search & Sort State
                memoSearch: '',
                memoSortBy: 'date_desc',
                memoText: '',

                // CSV state
                csvFile: null,
                rawCsvText: '',
                isImporting: false,

                // Edit Modal state
                showEditModal: false,
                editingLog: {},

                // Chart timeframe offset state
                chartOffsetDays: 0,

                saveTimezonePreference() {
                    localStorage.setItem('baby_tz', this.currentTimezone);
                },

                toggleCurrentTime(event) {
                    if (event.target.checked) {
                        try {
                            const now = new Date();
                            const tzDate = new Date(now.toLocaleString('en-US', { timeZone: this.currentTimezone }));
                            const pad = (n) => String(n).padStart(2, '0');
                            this.manualSleepStart = `${tzDate.getFullYear()}-${pad(tzDate.getMonth()+1)}-${pad(tzDate.getDate())}T${pad(tzDate.getHours())}:${pad(tzDate.getMinutes())}`;
                        } catch (e) {
                            this.manualSleepStart = new Date().toISOString().slice(0, 16);
                        }
                    } else {
                        this.manualSleepStart = '';
                    }
                },

                get runningSleepLog() {
                    return this.logs.find(l => l.category === 'sleep' && !l.end_time);
                },

                get filteredLogs() {
                    if (this.activeTab === 'sleep') return this.logs.filter(l => l.category === 'sleep');
                    if (this.activeTab === 'medicine') return this.logs.filter(l => l.category === 'medicine');
                    if (this.activeTab === 'memo') {
                        let list = this.logs.filter(l => l.category === 'memo');
                        if (this.memoSearch.trim()) {
                            const q = this.memoSearch.toLowerCase();
                            list = list.filter(m => (m.notes || '').toLowerCase().includes(q));
                        }
                        if (this.memoSortBy === 'date_desc') {
                            list.sort((a, b) => new Date(b.start_time || b.created_at) - new Date(a.start_time || a.created_at));
                        } else if (this.memoSortBy === 'date_asc') {
                            list.sort((a, b) => new Date(a.start_time || a.created_at) - new Date(b.start_time || b.created_at));
                        }
                        return list;
                    }
                    return this.logs;
                },

                get medicineLogs() {
                    return this.logs.filter(l => l.category === 'medicine');
                },

                get uniqueMedicineCount() {
                    const titles = this.medicineLogs.map(m => (m.title || '').trim().toLowerCase()).filter(Boolean);
                    return new Set(titles).size;
                },

                get totalMedVolume() {
                    return this.medicineLogs
                        .reduce((sum, m) => sum + (parseFloat(m.amount) || 0), 0)
                        .toFixed(1);
                },

                get processedMedLogs() {
                    let list = [...this.medicineLogs];
                    if (this.medSearch.trim()) {
                        const q = this.medSearch.toLowerCase();
                        list = list.filter(m => 
                            (m.title || '').toLowerCase().includes(q) || 
                            (m.notes || '').toLowerCase().includes(q)
                        );
                    }
                    if (this.medSortBy === 'date_desc') {
                        list.sort((a, b) => new Date(b.start_time || b.created_at) - new Date(a.start_time || a.created_at));
                    } else if (this.medSortBy === 'date_asc') {
                        list.sort((a, b) => new Date(a.start_time || a.created_at) - new Date(b.start_time || b.created_at));
                    } else if (this.medSortBy === 'name_asc') {
                        list.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
                    } else if (this.medSortBy === 'amount_desc') {
                        list.sort((a, b) => (b.amount || 0) - (a.amount || 0));
                    }
                    return list;
                },

                get avgSleep7Days() { return this.calculateAverageSleepDays(7); },
                get avgSleep30Days() { return this.calculateAverageSleepDays(30); },
                get avgSleepYear() { return this.calculateAverageSleepDays(365); },
                get avgSleepAll() {
                    const sleepLogs = this.logs.filter(l => l.category === 'sleep' && l.duration_minutes > 0);
                    if (sleepLogs.length === 0) return '0 hrs 0 mins';
                    const dates = [...new Set(sleepLogs.map(l => new Date(l.start_time).toISOString().slice(0, 10)))];
                    const totalMins = sleepLogs.reduce((sum, l) => sum + l.duration_minutes, 0);
                    const avgMins = Math.round(totalMins / dates.length);
                    return this.formatDurationHoursMins(avgMins);
                },

                calculateAverageSleepDays(daysCount) {
                    let totalMins = 0;
                    let activeDays = 0;
                    for (let i = 0; i < daysCount; i++) {
                        let d = new Date();
                        d.setDate(d.getDate() - i);
                        let dateStr = d.toISOString().slice(0, 10);
                        let dayMins = this.logs
                            .filter(l => l.category === 'sleep' && l.start_time && l.start_time.startsWith(dateStr))
                            .reduce((sum, l) => sum + (l.duration_minutes || 0), 0);
                        if (dayMins > 0) {
                            totalMins += dayMins;
                            activeDays++;
                        }
                    }
                    if (activeDays === 0) return '0 hrs 0 mins';
                    return this.formatDurationHoursMins(Math.round(totalMins / activeDays));
                },

                async init() {
                    setInterval(() => {
                        try {
                            this.liveClock = new Date().toLocaleTimeString([], { timeZone: this.currentTimezone, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        } catch (e) {
                            this.liveClock = new Date().toLocaleTimeString();
                        }
                    }, 1000);

                    const { data } = await supabaseClient.auth.getUser();
                    this.user = data.user;
                    if (this.user) {
                        await this.fetchLogs();
                    }
                    supabaseClient.auth.onAuthStateChange(async (event, session) => {
                        this.user = session?.user || null;
                        if (this.user) await this.fetchLogs();
                    });
                },

                async login() {
                    this.authError = '';
                    const { error } = await supabaseClient.auth.signInWithPassword({ email: this.authEmail, password: this.authPassword });
                    if (error) this.authError = error.message;
                },

                async signup() {
                    this.authError = '';
                    const { error } = await supabaseClient.auth.signUp({ email: this.authEmail, password: this.authPassword });
                    if (error) this.authError = error.message;
                    else alert('Registration successful! You can now sign in.');
                },

                async logout() {
                    await supabaseClient.auth.signOut();
                    this.logs = [];
                },

                async fetchLogs() {
                    const { data, error } = await supabaseClient
                        .from('baby_logs')
                        .select('*')
                        .order('start_time', { ascending: false });
                    if (!error) this.logs = data || [];
                },

                // Manual Sleep Entry
                async saveManualSleep() {
                    if (!this.manualSleepStart) {
                        return alert('Please select a Start Date & Time.');
                    }
                    if (this.manualSleepIsRunning && this.runningSleepLog) {
                        return alert('A sleep log is already running! Please stop the active sleep session first.');
                    }

                    const start = new Date(this.manualSleepStart);
                    let end = null;
                    let durationMinutes = 0;

                    if (!this.manualSleepIsRunning) {
                        if (!this.manualSleepEnd) return alert('Please select an End Date & Time or check "Currently Running".');
                        end = new Date(this.manualSleepEnd);
                        if (end <= start) return alert('End Date & Time must be after Start Date & Time.');
                        durationMinutes = Math.round((end - start) / 60000);
                    }

                    await supabaseClient.from('baby_logs').insert([{
                        user_id: this.user.id,
                        category: 'sleep',
                        start_time: start.toISOString(),
                        end_time: end ? end.toISOString() : null,
                        duration_minutes: durationMinutes,
                        notes: this.sleepNote
                    }]);

                    this.manualSleepStart = '';
                    this.manualSleepEnd = '';
                    this.manualSleepIsRunning = false;
                    this.sleepNote = '';
                    await this.fetchLogs();
                },

                async stopRunningLog(log) {
                    const now = new Date();
                    const start = new Date(log.start_time);
                    const durationMinutes = Math.max(1, Math.round((now - start) / 60000));

                    await supabaseClient.from('baby_logs').update({
                        end_time: now.toISOString(),
                        duration_minutes: durationMinutes
                    }).eq('id', log.id);

                    await this.fetchLogs();
                },

                formatDurationHoursMins(totalMins) {
                    const h = Math.floor(totalMins / 60);
                    const m = totalMins % 60;
                    if (h === 0) return `${m} mins`;
                    return `${h} hrs ${m} mins`;
                },

                async saveMedicine() {
                    if (!this.medTitle) return alert('Please enter medicine name');
                    await supabaseClient.from('baby_logs').insert([{
                        user_id: this.user.id,
                        category: 'medicine',
                        start_time: new Date().toISOString(),
                        title: this.medTitle,
                        amount: parseFloat(this.medAmount) || 0,
                        unit: this.medUnit
                    }]);
                    this.medTitle = '';
                    this.medAmount = '';
                    await this.fetchLogs();
                },

                async saveMemo() {
                    if (!this.memoText) return alert('Please enter memo notes');
                    await supabaseClient.from('baby_logs').insert([{
                        user_id: this.user.id,
                        category: 'memo',
                        start_time: new Date().toISOString(),
                        notes: this.memoText
                    }]);
                    this.memoText = '';
                    await this.fetchLogs();
                },

                openEditModal(log) {
                    const toLocalDateTimeStr = (utcStr) => {
                        if (!utcStr) return '';
                        try {
                            const d = new Date(utcStr);
                            const tzDate = new Date(d.toLocaleString('en-US', { timeZone: this.currentTimezone }));
                            const pad = (n) => String(n).padStart(2, '0');
                            return `${tzDate.getFullYear()}-${pad(tzDate.getMonth()+1)}-${pad(tzDate.getDate())}T${pad(tzDate.getHours())}:${pad(tzDate.getMinutes())}`;
                        } catch (e) {
                            return utcStr.slice(0, 16);
                        }
                    };

                    this.editingLog = {
                        id: log.id,
                        category: log.category,
                        start_time: toLocalDateTimeStr(log.start_time),
                        end_time: toLocalDateTimeStr(log.end_time),
                        title: log.title || '',
                        amount: log.amount || 0,
                        unit: log.unit || 'ml',
                        notes: log.notes || ''
                    };
                    this.showEditModal = true;
                },

                async saveEditModal() {
                    const start = this.editingLog.start_time ? new Date(this.editingLog.start_time) : null;
                    const end = this.editingLog.end_time ? new Date(this.editingLog.end_time) : null;
                    let durationMinutes = 0;

                    if (this.editingLog.category === 'sleep' && start && end) {
                        durationMinutes = Math.max(1, Math.round((end - start) / 60000));
                    }

                    const updateData = {
                        start_time: start ? start.toISOString() : null,
                        end_time: end ? end.toISOString() : null,
                        duration_minutes: durationMinutes,
                        title: this.editingLog.title,
                        amount: parseFloat(this.editingLog.amount) || 0,
                        unit: this.editingLog.unit,
                        notes: this.editingLog.notes
                    };

                    await supabaseClient.from('baby_logs').update(updateData).eq('id', this.editingLog.id);
                    this.showEditModal = false;
                    await this.fetchLogs();
                },

                async deleteLog(id) {
                    if (!confirm('Are you sure you want to delete this log?')) return;
                    await supabaseClient.from('baby_logs').delete().eq('id', id);
                    await this.fetchLogs();
                },

                async deleteAllCategoryLogs(category) {
                    if (!confirm(`Are you sure you want to PERMANENTLY delete ALL ${category.toUpperCase()} logs?`)) return;
                    await supabaseClient.from('baby_logs').delete().eq('user_id', this.user.id).eq('category', category);
                    await this.fetchLogs();
                },

                formatLogDetails(log) {
                    if (log.category === 'medicine') return `${log.title} — ${log.amount} ${log.unit}`;
                    if (log.category === 'memo') return log.notes;
                    return '';
                },

                formatDateInTZ(dateStr) {
                    if (!dateStr) return '';
                    try {
                        return new Date(dateStr).toLocaleString([], { timeZone: this.currentTimezone, month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    } catch (e) {
                        return new Date(dateStr).toLocaleString();
                    }
                },

                formatTimeInTZ(dateStr) {
                    if (!dateStr) return 'N/A';
                    try {
                        return new Date(dateStr).toLocaleTimeString([], { timeZone: this.currentTimezone, hour: '2-digit', minute: '2-digit' });
                    } catch (e) {
                        return new Date(dateStr).toLocaleTimeString();
                    }
                },

                shiftDays(delta) {
                    this.chartOffsetDays += delta;
                    if (this.chartOffsetDays > 0) this.chartOffsetDays = 0;
                },

                resetDays() {
                    this.chartOffsetDays = 0;
                },

                exportCSV() {
                    let csv = 'category,start_time,end_time,duration_minutes,title,amount,unit,notes\n';
                    this.logs.forEach(l => {
                        csv += `"${l.category}","${l.start_time || ''}","${l.end_time || ''}",${l.duration_minutes || 0},"${l.title || ''}",${l.amount || 0},"${l.unit || ''}","${l.notes || ''}"\n`;
                    });
                    const blob = new Blob([csv], { type: 'text/csv' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `baby_logs_${new Date().toISOString().slice(0,10)}.csv`;
                    a.click();
                },

                processCSVFileImport() {
                    if (!this.csvFile) return alert('Please select a CSV file first.');
                    this.executeCSVParse(this.csvFile);
                },

                processCSVPasteImport() {
                    if (!this.rawCsvText.trim()) return alert('Please paste your CSV data first.');
                    this.executeCSVParse(this.rawCsvText);
                },

                executeCSVParse(inputSource) {
                    this.isImporting = true;
                    Papa.parse(inputSource, {
                        header: true,
                        skipEmptyLines: true,
                        complete: async (results) => {
                            const rows = results.data;
                            let count = 0;
                            for (let row of rows) {
                                let type = (row['Type'] || row['category'] || '').trim().toLowerCase();
                                let startTime = row['Start Date/time'] || row['start_time'] ? new Date(row['Start Date/time'] || row['start_time']).toISOString() : null;
                                let endTime = row['[Sleep] End Date/time'] || row['end_time'] ? new Date(row['[Sleep] End Date/time'] || row['end_time']).toISOString() : null;
                                let note = row['Note'] || row['notes'] || '';

                                let category = 'memo';
                                let title = row['title'] || null;
                                let amount = parseFloat(row['amount']) || 0;
                                let unit = row['unit'] || '';
                                let durationMinutes = parseInt(row['duration_minutes']) || 0;

                                if (type === 'sleep') {
                                    category = 'sleep';
                                    let sec = parseFloat(row['[Sleep] Duration (Seconds)']);
                                    if (!isNaN(sec) && sec > 0) {
                                        durationMinutes = Math.round(sec / 60);
                                    } else if (endTime && startTime) {
                                        let diffMs = new Date(endTime) - new Date(startTime);
                                        durationMinutes = Math.max(1, Math.round(diffMs / 60000));
                                    } else if (!durationMinutes) {
                                        durationMinutes = 1;
                                    }
                                } else if (type === 'medical' || type === 'medicine') {
                                    category = 'medicine';
                                    let medStr = row['[Medical] Medication'] || row['title'] || 'Medicine';
                                    let parts = medStr.split(',');
                                    title = parts[0].trim();
                                    if (parts[1]) {
                                        let amtMatch = parts[1].match(/([\d.]+)/);
                                        amount = amtMatch ? parseFloat(amtMatch[1]) : 0;
                                        let unitMatch = parts[1].match(/[a-zA-Z]+/);
                                        unit = unitMatch ? unitMatch[0] : 'ml';
                                    }
                                } else {
                                    category = 'memo';
                                    if (!note) note = `[${row['Type'] || 'Memo'}]`;
                                }

                                await supabaseClient.from('baby_logs').insert([{
                                    user_id: this.user.id,
                                    category: category,
                                    start_time: startTime,
                                    end_time: endTime,
                                    duration_minutes: durationMinutes,
                                    title: title,
                                    amount: amount,
                                    unit: unit,
                                    notes: note
                                }]);
                                count++;
                            }
                            alert(`Successfully imported ${count} logs!`);
                            this.isImporting = false;
                            this.csvFile = null;
                            this.rawCsvText = '';
                            await this.fetchLogs();
                        },
                        error: (err) => {
                            alert('Error parsing CSV: ' + err.message);
                            this.isImporting = false;
                        }
                    });
                },

                // Render Stacked Sleep Chart with Hour/Minute Hover Tooltips & Updated Color Logic
                renderSleepChart() {
                    const ctx = document.getElementById('sleepChart').getContext('2d');
                    if (window.sleepChartInstance) window.sleepChartInstance.destroy();

                    const labels = [];
                    const maxSessionsPerDay = 6;
                    const datasets = [];

                    for (let s = 0; s < maxSessionsPerDay; s++) {
                        datasets.push({
                            label: `Session ${s+1}`,
                            data: new Array(7).fill(0),
                            durationMinsArray: new Array(7).fill(0),
                            backgroundColor: [],
                            borderRadius: 4
                        });
                    }

                    for (let i = 6; i >= 0; i--) {
                        let d = new Date();
                        d.setDate(d.getDate() + this.chartOffsetDays - i);
                        let dateStr = d.toISOString().slice(0, 10);
                        
                        let dayName = d.toLocaleDateString([], { weekday: 'short', timeZone: this.currentTimezone });
                        let dateFormatted = d.toLocaleDateString([], { month: 'short', day: 'numeric', timeZone: this.currentTimezone });
                        labels.push(`${dayName}, ${dateFormatted}`);

                        let daySleeps = this.logs.filter(l => l.category === 'sleep' && l.start_time && l.start_time.startsWith(dateStr));
                        
                        daySleeps.forEach((sleep, sIdx) => {
                            if (sIdx < maxSessionsPerDay) {
                                let totalMins = sleep.duration_minutes || 0;
                                let durationHours = parseFloat((totalMins / 60).toFixed(2));
                                datasets[sIdx].data[6 - i] = durationHours;
                                datasets[sIdx].durationMinsArray[6 - i] = totalMins;

                                // Updated Color Coding Logic:
                                // Green: >= 8h
                                // Blue: 4h to < 8h
                                // Yellow: 1h to < 4h
                                // Light Pink: < 1h
                                let hours = totalMins / 60;
                                let color = '#f472b6'; // Light Pink (< 1h)
                                if (hours >= 8) color = '#34d399';      // Green (>= 8h)
                                else if (hours >= 4) color = '#60a5fa'; // Blue (4h to <8h)
                                else if (hours >= 1) color = '#fbbf24'; // Yellow (1h to <4h)

                                datasets[sIdx].backgroundColor[6 - i] = color;
                            }
                        });
                    }

                    window.sleepChartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: datasets.filter(ds => ds.data.some(val => val > 0))
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            const datasetIndex = context.datasetIndex;
                                            const dataIndex = context.dataIndex;
                                            const mins = window.sleepChartInstance.data.datasets[datasetIndex].durationMinsArray[dataIndex];
                                            if (!mins) return '';
                                            const h = Math.floor(mins / 60);
                                            const m = mins % 60;
                                            return ` Duration: ${h} hrs ${m} mins`;
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: { stacked: true },
                                y: {
                                    stacked: true,
                                    beginAtZero: true,
                                    ticks: {
                                        stepSize: 0.5,
                                        callback: function(value) {
                                            return value.toFixed(1) + ' h';
                                        }
                                    },
                                    title: {
                                        display: true,
                                        text: 'Hours'
                                    }
                                }
                            }
                        }
                    });
                },

                renderMedChart() {
                    const ctx = document.getElementById('medChart').getContext('2d');
                    if (window.medChartInstance) window.medChartInstance.destroy();

                    const medCounts = {};
                    this.medicineLogs.forEach(m => {
                        const name = m.title || 'Other';
                        medCounts[name] = (medCounts[name] || 0) + 1;
                    });

                    const labels = Object.keys(medCounts);
                    const dataValues = Object.values(medCounts);

                    window.medChartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels.length ? labels : ['No Data'],
                            datasets: [{
                                label: 'Doses Given',
                                data: dataValues.length ? dataValues : [0],
                                backgroundColor: '#34d399',
                                borderRadius: 8
                            }]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: { precision: 0 }
                                }
                            }
                        }
                    });
                }
            }
        }
    </script>
